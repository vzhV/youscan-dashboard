name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  precommit:
    name: pre-commit
    runs-on: ubuntu-24.04
    env:
      # The backend and frontend jobs run these toolchain hooks.
      SKIP: ruff-format,ruff-check,mypy,lint-imports,prettier,eslint,frontend-typecheck
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uvx pre-commit run --all-files

  backend:
    runs-on: ubuntu-24.04
    env:
      TEST_DATABASE_URL: postgresql+psycopg://dashboard:dashboard@localhost:5432/dashboard_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dashboard
          POSTGRES_PASSWORD: dashboard
          POSTGRES_DB: dashboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dashboard -d dashboard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
      - run: make backend-install backend-lint backend-typecheck backend-test

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: make backend-install
      - run: make frontend-install
      - run: make gen-api-check
      - run: make frontend-lint frontend-typecheck frontend-test frontend-build

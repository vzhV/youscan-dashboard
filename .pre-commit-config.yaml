exclude: ^backend/seed_data/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-yaml
        # pnpm 12 writes a multi-document lockfile, which the strict single-document check rejects.
        exclude: ^frontend/pnpm-lock\.yaml$
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: detect-private-key
  - repo: local
    hooks:
      - id: file-length
        name: file length (max 250 lines)
        entry: python3 scripts/check_file_length.py
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen --directory backend ruff format .
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen --directory backend ruff check --fix .
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: uv run --frozen --directory backend mypy app tests migrations
        language: system
        files: ^backend/(.*\.py|pyproject\.toml)$
        pass_filenames: false
      - id: lint-imports
        name: import-linter
        entry: uv run --frozen --directory backend lint-imports
        language: system
        files: ^backend/(.*\.py|pyproject\.toml)$
        pass_filenames: false
      - id: prettier
        name: prettier
        entry: make frontend-format
        language: system
        files: ^frontend/
        pass_filenames: false
      - id: eslint
        name: eslint
        entry: make frontend-eslint
        language: system
        files: ^frontend/
        pass_filenames: false
      - id: frontend-typecheck
        name: frontend typecheck
        entry: make frontend-typecheck
        language: system
        files: ^frontend/
        pass_filenames: false

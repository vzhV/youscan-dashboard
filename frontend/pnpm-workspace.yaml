# unrs-resolver (via eslint-import-resolver-typescript) ships prebuilt binaries; its install script is not needed.
allowBuilds:
  unrs-resolver: false
# typescript-eslint uses a caret range; pnpm's minimumReleaseAge keeps it at 8.72.0 because 8.72.1 is still too new.
# openapi-typescript 7 declares typescript@^5 but works with TypeScript 6; typescript-eslint caps us below 7.
peerDependencyRules:
  allowedVersions:
    openapi-typescript>typescript: "6"
